<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-label="Waseem, MSc Financial Technology, Imperial. I build systems end to end, then try to break them. now shipping: fx-research, a look-ahead-proof FX backtester, fitsylvania.com, live video coaching, a workout builder for trainers, recurring coaching plans on Stripe, an AI vision conveyor sorter. Selected work. Quant research: Found the bug that faked a +110R edge. (fx-research · 2015 to 2026); Ai computer vision: A camera and an AI model sort real objects. (CBD · Best Project Prize); Product and revenue: Turned a game server into a business. (SurfPractice · Java). The FX chart shows the same strategy ending at +110R with the bug and -42R with it fixed. PvP Surf earns USD 1,200 a month from 100+ users. How I got here, in code. 2020: Minecraft plugins (Java). 2021: Game backends (Redis, MongoDB). 2024: Data analysis (pandas, NumPy). 2025: Fitsylvania (Next.js, Stripe). 2026: AI vision sorter (Python, AI vision). now: Quant research (Python, pytest).">
