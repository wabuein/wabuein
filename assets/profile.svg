<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Waseem, MSc Financial Technology, Imperial. I build systems end to end, then try to break them. now shipping: fx-research, a look-ahead-proof FX backtester, fitsylvania.com, live video coaching, a workout builder for trainers, recurring coaching plans on Stripe, an AI vision conveyor sorter. Selected work. Quant research: Found the bug that faked a +110R edge. (fx-research · 12 FX pairs · 2015 to 2026); Ai computer vision: A camera and an AI model sort real objects. (CBD · Best Project Prize, 82%); Product and revenue: Turned a game server into a business. (SurfPractice · Java · PvP Surf). The FX chart shows the same strategy ending at +110R with the bug and -42R with it fixed. How I got here, in code. 2020: Minecraft plugins (Java). 2021: Game backends (Redis, MongoDB). 2024: Data analysis (pandas, NumPy). 2025: Fitsylvania (Next.js, Stripe). 2026: AI vision sorter (Python, computer vision). now: Quant research (Python, pytest).">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#0A0F1A"/>
      <stop offset="1" stop-color="#0E1A24"/>
    </linearGradient>
    <radialGradient id="glow" cx=".85" cy=".1" r=".55">
      <stop offset="0" stop-color="#3DF5B0" stop-opacity=".09"/>
      <stop offset="1" stop-color="#3DF5B0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="track" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="1080" y2="0">
      <stop offset="0" stop-color="#7AA2FF"/>
      <stop offset="1" stop-color="#3DF5B0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="750" rx="18"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .tk { opacity: 0; animation: tick 24.5s cubic-bezier(.3,.7,.2,1) infinite both; }
      @keyframes tick { 0% { opacity: 0; transform: translateY(16px); } 1.714% { opacity: 1; transform: translateY(0); } 14.286% { opacity: 1; transform: translateY(0); } 16%, 100% { opacity: 0; transform: translateY(-16px); } }
      .eq { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw-eq 3s cubic-bezier(.45,.05,.3,1) 1.2s forwards; }
      @keyframes draw-eq { to { stroke-dashoffset: 0; } }
      .eqend { opacity: 0; animation: fade .6s ease 4.1s forwards; }
      .pop { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) 1.4s forwards; }
      .pop2 { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) 1.8s forwards; }
      @keyframes fade { to { opacity: 1; } }
      .cbd-item { animation: cbd-item 10s cubic-bezier(.45,.05,.3,1) 1s infinite both; }
      @keyframes cbd-item { 0% { transform: translate(0,0); opacity: 0; } 4% { opacity: 1; } 22%, 40% { transform: translate(94px,0); } 58% { transform: translate(236px,0); } 66% { transform: translate(270px,28px); opacity: 1; } 74%, 100% { transform: translate(270px,28px); opacity: 0; } }
      .cbd-box { opacity: 0; animation: cbd-box 10s ease 1s infinite both; }
      @keyframes cbd-box { 0%, 23% { opacity: 0; } 27%, 39% { opacity: 1; } 43%, 100% { opacity: 0; } }
      .cbd-gate { transform-box: fill-box; transform-origin: 0 50%; animation: cbd-gate 10s ease 1s infinite both; }
      @keyframes cbd-gate { 0%, 44% { transform: rotate(0deg); } 52%, 70% { transform: rotate(38deg); } 78%, 100% { transform: rotate(0deg); } }
      .draw { stroke-dasharray: 960; stroke-dashoffset: 960; animation: draw 3s cubic-bezier(.45,.05,.25,1) 1.6s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .stop { opacity: 0; animation: rise .6s cubic-bezier(.2,.8,.2,1.2) forwards; }
    </style>
  </defs>
