      .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .tk { opacity: 0; animation: tick 24.5s cubic-bezier(.3,.7,.2,1) infinite both; }
      @keyframes tick { 0% { opacity: 0; transform: translateY(16px); } 1.714% { opacity: 1; transform: translateY(0); } 14.286% { opacity: 1; transform: translateY(0); } 16%, 100% { opacity: 0; transform: translateY(-16px); } }
      .eq { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw-eq 3s cubic-bezier(.45,.05,.3,1) 1.2s forwards; }
      @keyframes draw-eq { to { stroke-dashoffset: 0; } }
      .eqend { opacity: 0; animation: fade .6s ease 4.1s forwards; }
      .pop { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) 1.4s forwards; }
      .pop2 { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) 1.8s forwards; }
      @keyframes fade { to { opacity: 1; } }
      .cbd-item { animation: cbd-item 10s cubic-bezier(.45,.05,.3,1) 1s infinite both; }
      @keyframes cbd-item { 0% { transform: translate(0,0); opacity: 0; } 4% { opacity: 1; } 22%, 40% { transform: translate(74px,0); } 58% { transform: translate(176px,0); } 66% { transform: translate(206px,28px); opacity: 1; } 74%, 100% { transform: translate(206px,28px); opacity: 0; } }
      .cbd-box { opacity: 0; animation: cbd-box 10s ease 1s infinite both; }
      @keyframes cbd-box { 0%, 23% { opacity: 0; } 27%, 39% { opacity: 1; } 43%, 100% { opacity: 0; } }
      .cbd-gate { transform-box: fill-box; transform-origin: 0 50%; animation: cbd-gate 10s ease 1s infinite both; }
      @keyframes cbd-gate { 0%, 44% { transform: rotate(0deg); } 52%, 70% { transform: rotate(38deg); } 78%, 100% { transform: rotate(0deg); } }
      .draw { stroke-dasharray: 708; stroke-dashoffset: 708; animation: draw 3s cubic-bezier(.45,.05,.25,1) 1.6s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .stop { opacity: 0; animation: rise .6s cubic-bezier(.2,.8,.2,1.2) forwards; }
    </style>
